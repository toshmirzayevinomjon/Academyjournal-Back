services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./kundalik.db:/app/kundalik.db
      - ./uploads:/app/uploads
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///app/kundalik.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
